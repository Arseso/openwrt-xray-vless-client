[package]
name = "xvpn"
version = "0.1.0"
description = "Remote control of luci-app-xvpn on an OpenWrt router"
authors = ["Artem Sokolov <arseso.main@gmail.com>"]
license = "MIT"
repository = "https://github.com/Arseso/openwrt-xray-vless-client"
edition = "2021"
rust-version = "1.90"

[lib]
# the _lib suffix: on Windows a lib and a bin of the same name collide (cargo#8519)
name = "xvpn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls with ring only: no OpenSSL to ship on Windows, one TLS stack for the pin check
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-notification = "2"

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
