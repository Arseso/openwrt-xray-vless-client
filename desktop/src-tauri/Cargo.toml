[package]
name = "xvpn"
version = "0.1.0"
description = "Remote control of luci-app-xvpn on an OpenWrt router"
authors = ["Artem Sokolov <arseso.main@gmail.com>"]
license = "MIT"
repository = "https://github.com/Arseso/openwrt-xray-vless-client"
edition = "2021"
rust-version = "1.90"

[lib]
# the _lib suffix: on Windows a lib and a bin of the same name collide (cargo#8519)
name = "xvpn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls with ring only: no OpenSSL to ship on Windows, one TLS stack for the pin check
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
# tray.rs: autostart; vpncheck.rs: public CAs for the echo services
tauri-plugin-autostart = "2"
# tray.rs: Open LuCI as a URL (ShellExecuteW / xdg-open); lib.rs: one running app
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
webpki-roots = "1"
# vpncheck.rs: a time limit for the resolver (tokio is in the tree through tauri)
tokio = { version = "1", features = ["time"] }

tauri-plugin-notification = "2"
# the tabs of #79 (src/screens.rs)
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# updates from the GitHub release (#81): rustls with ring as above, no OpenSSL; it asks
# with tauri-plugin-dialog above
tauri-plugin-updater = "2"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(target_os = "linux")'.dependencies]
# tray.rs: is there a StatusNotifierItem host (already in the tree through keyring)
dbus = "0.9"

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
