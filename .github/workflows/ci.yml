# Tests, integration test and ipk build on every PR (its merge with the base
# branch) and push to main; a v* tag also publishes a GitHub Release with the ipk.
# The jobs run the same scripts as a local checkout (scripts/test.sh, itest.sh,
# build.sh), only with plain docker.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # a tag that does not match the package fails at once, before the long jobs
  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ipk: ${{ steps.check.outputs.ipk }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the tag against PKG_VERSION and PKG_RELEASE
        id: check
        run: |
          ver=$(sed -n 's/^PKG_VERSION:=//p' luci-app-xvpn/Makefile)
          rel=$(sed -n 's/^PKG_RELEASE:=//p' luci-app-xvpn/Makefile)
          want="v$ver"; [ "$rel" = 1 ] || want="v$ver-r$rel"
          [ "$GITHUB_REF_NAME" = "$want" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match the package: expected $want (PKG_VERSION $ver, PKG_RELEASE $rel)"
            exit 1
          }
          echo "ipk=luci-app-xvpn_${ver}-r${rel}_all.ipk" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # feed: xray-core 25.1.30 from the OpenWrt 24.10 feed, what the router gets.
        # latest: the last xray release from GitHub, informational until #14
        xray: [feed, latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the latest xray
        if: matrix.xray == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download --repo XTLS/Xray-core --pattern Xray-linux-64.zip --pattern Xray-linux-64.zip.dgst
          sum=$(sed -n 's/^SHA2-256= *//p' Xray-linux-64.zip.dgst)
          [ -n "$sum" ] || { echo "::error::no SHA2-256 in Xray-linux-64.zip.dgst"; exit 1; }
          echo "$sum  Xray-linux-64.zip" | sha256sum -c -
          unzip -o Xray-linux-64.zip xray -d xray
          echo "XRAY_BIN=$RUNNER_TEMP/xray/xray" >> "$GITHUB_ENV"
      - name: scripts/test.sh
        # the latest xray may reject the config before #14: warn, do not fail
        continue-on-error: ${{ matrix.xray == 'latest' }}
        run: sh scripts/test.sh

  itest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: scripts/itest.sh
        # it takes ~5 min; a hung run is stopped after 12 with the container state in the log
        # (timeout kills the script without its EXIT trap, so the container is still there)
        run: |
          rc=0; timeout 720 sh scripts/itest.sh || rc=$?
          if [ $rc = 124 ]; then
            echo "::error::itest hangs, killed after 12 min"
            timeout 60 docker exec xvpn-itest sh -c 'ps w; ubus -t 3 call xvpn status; ubus -t 3 call service list "{\"name\":\"xvpn\"}"; logread | tail -80' || true
            docker rm -f xvpn-itest >/dev/null
          fi
          exit $rc

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: scripts/build.sh
        env:
          DOCKER: docker
        run: sh scripts/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ipk
          path: dist/*.ipk
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, test, itest, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ipk
          path: dist
      - name: Check the built package
        env:
          IPK: ${{ needs.version.outputs.ipk }}
        run: |
          [ -f "dist/$IPK" ] || { echo "::error::no dist/$IPK: $(ls dist)"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.ipk --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
