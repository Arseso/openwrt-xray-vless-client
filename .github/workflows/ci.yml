# Tests, integration test and ipk build on every push and PR; a v* tag also
# publishes a GitHub Release with the ipk. The jobs run the same scripts as a
# local checkout (scripts/test.sh, itest.sh, build.sh), only with plain docker.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    # a PR from a branch of this repository is already tested by its push
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # feed: xray-core 25.1.30 from the OpenWrt 24.10 feed, what the router gets.
        # latest: the last xray release from GitHub, informational until #14
        xray: [feed, latest]
    steps:
      - uses: actions/checkout@v7
      - name: Download the latest xray
        if: matrix.xray == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo XTLS/Xray-core --pattern Xray-linux-64.zip --dir "$RUNNER_TEMP"
          unzip -o "$RUNNER_TEMP/Xray-linux-64.zip" xray -d "$RUNNER_TEMP/xray"
          echo "XRAY_BIN=$RUNNER_TEMP/xray/xray" >> "$GITHUB_ENV"
      - name: scripts/test.sh
        # the latest xray may reject the config before #14: warn, do not fail
        continue-on-error: ${{ matrix.xray == 'latest' }}
        run: sh scripts/test.sh

  itest:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: scripts/itest.sh
        # it takes ~5 min; a hung run is stopped after 12 with the container state in the log
        run: |
          sh scripts/itest.sh & pid=$!
          ( sleep 720
            echo "::error::itest hangs, killed"
            docker exec xvpn-itest sh -c 'ps w; ubus -t 3 call xvpn status; ubus -t 3 call service list "{\"name\":\"xvpn\"}"; logread | tail -80'
            kill $pid ) & watchdog=$!
          rc=0; wait $pid || rc=$?
          kill $watchdog 2>/dev/null || true
          exit $rc

  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: scripts/build.sh
        env:
          DOCKER: docker
        run: sh scripts/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ipk
          path: dist/*.ipk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, itest, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ipk
          path: dist
      - name: Check that the tag matches PKG_VERSION
        run: |
          ver="${GITHUB_REF_NAME#v}"
          ls dist/luci-app-xvpn_"$ver"-r*_all.ipk >/dev/null 2>&1 || {
            echo "::error::tag $GITHUB_REF_NAME does not match the package: $(ls dist)"
            exit 1
          }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.ipk --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
